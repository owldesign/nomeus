# macos — Nomeus.app: swift test + bundle on every change under apps/macos, zip as a run artifact.
# Tags are release.yml's job (its `app` job attaches the zip to the Release). Ad-hoc signed: no Developer ID,
# no notarization. See apps/macos/README.md.
name: macos

on:
  push:
    branches: [main]
    paths: ['apps/macos/**', '.github/workflows/macos.yml', 'site/favicon.svg', 'config/nomeus.php']
  pull_request:
    paths: ['apps/macos/**', '.github/workflows/macos.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # bundle.sh uses the commit count as CFBundleVersion
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: swift --version
        run: swift --version
      - uses: actions/cache@v5
        with:
          path: apps/macos/.build
          key: spm-${{ runner.os }}-${{ hashFiles('apps/macos/Package.swift') }}
      - name: test
        run: swift test
      - name: bundle
        run: scripts/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Nomeus.app
          path: apps/macos/dist/Nomeus-*.zip
          if-no-files-found: error
